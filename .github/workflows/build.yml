name: Build All Wheels

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install setuptools wheel pybind11 cmake

    - name: CMake Configuration
      run: |
        $py_path = python -c "import sys; print(sys.executable)"
        
        $pb_path = python -c "import pybind11; print(pybind11.get_cmake_dir())"
        
        Write-Host "Force CMake to use Python at: $py_path"

        cmake -S py_wx_key -B build `
          "-Dpybind11_DIR=$pb_path" `
          "-DPython_EXECUTABLE=$py_path" `
          -DCMAKE_BUILD_TYPE=Release                

    - name: Build Extension
      run: |
        cmake --build build --config Release


    - name: Move pyd to packaging
      run: |
        if (-not (Test-Path "packaging/wx_key")) { New-Item -ItemType Directory -Path "packaging/wx_key" }
        Copy-Item "build/Release/*.pyd" -Destination "packaging/wx_key/" -Force
        if (-not (Test-Path "packaging/wx_key/__init__.py")) { "from .wx_key import *" | Out-File "packaging/wx_key/__init__.py" -Encoding utf8 }

    - name: Build Wheel
      working-directory: ./packaging
      run: |
        python setup.py bdist_wheel

    - name: Upload Wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.python-version }}
        path: packaging/dist/*.whl

  build-linux:
    name: Build Linux wheels for Python ${{ matrix.python-version }}
    # 产物基线：Ubuntu 22.04（glibc 2.35）。比它更老的发行版跑不了，属预期。
    #
    # 打的是裸 linux_x86_64（不做 manylinux 重打）：与 Windows 那套裸 win_amd64
    # wheel 的约定一致，消费方（WCDA 的 tools/key_wheels + find-links）直接可用。
    # 不用 auditwheel 是因为 22.04 自带的 patchelf 0.14.3 < auditwheel 要求的 0.14.5；
    # 若以后确实需要 manylinux 标签，正确做法是改用 pypa/manylinux 容器（或 cibuildwheel）
    # 在镜像内构建 + repair，而不是在宿主机上硬凑 patchelf。
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install setuptools wheel pybind11 cmake ninja

    - name: CMake Configuration
      run: |
        cmake -S py_wx_key -B build -G Ninja \
          "-Dpybind11_DIR=$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')" \
          "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Extension
      run: |
        cmake --build build

    - name: Move .so to packaging
      run: |
        mkdir -p packaging/wx_key
        cp build/wx_key.*.so packaging/wx_key/
        if [ ! -f packaging/wx_key/__init__.py ]; then echo "from .wx_key import *" > packaging/wx_key/__init__.py; fi

    - name: Build Wheel
      working-directory: ./packaging
      run: |
        python setup.py bdist_wheel

    # 防"空包"：这个打包方式是预编译 .so + setup.py，.so 没被 cp 进去时
    # bdist_wheel 依然成功，只是产出一个没有扩展模块的坏 wheel。
    - name: Verify wheel contains the extension
      run: |
        python -c "import glob,zipfile,sys; w=glob.glob('packaging/dist/*.whl')[0]; s=[n for n in zipfile.ZipFile(w).namelist() if n.endswith('.so')]; print(w,'->',s); sys.exit(0 if s else 1)"

    - name: Upload Wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-linux-${{ matrix.python-version }}
        path: packaging/dist/*.whl

  test-linux:
    name: Linux hook regression tests
    # 不需要微信：假目标 + 真 ptrace，覆盖 TRACEME 自启动、新线程布防、
    # 线程亲和性前提、以及锚点推导（对 build 出来的假目标）。
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install pybind11 cmake ninja

    - name: CMake Configuration
      run: |
        cmake -S py_wx_key -B build -G Ninja \
          "-Dpybind11_DIR=$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')" \
          "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" \
          -DCMAKE_BUILD_TYPE=Release \
          -DWXK_BUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build

    - name: Test
      run: |
        ctest --test-dir build --output-on-failure

  merge_artifacts:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: all-wheels
          pattern: wheel-*
